name: Run Pytest

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each module imports its own packages, so its tests run from its folder.
        include:
          - { name: CTC Office, dir: CTC-Office }
          - { name: Track Controller SW, dir: TrackCtrlSW }
          - { name: Track Controller HW, dir: TrackCtrlHw }
          - { name: Track Model, dir: TrackModel }
          - { name: Track layout, dir: Track_layout }
          - { name: Train Controller SW, dir: TrainController }
          - { name: Train Controller HW, dir: Train-Ctrl_HW, pythonpath: ../TrainModel }
          - { name: Train Model, dir: TrainModel }
          - { name: Utils, dir: ., target: utils }
          - { name: Harness and HW link, dir: ., target: common }

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ matrix.pythonpath }}

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run tests with pytest
      working-directory: ${{ matrix.dir }}
      run: python -m pytest -p no:cacheprovider ${{ matrix.target }}
