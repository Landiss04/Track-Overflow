name: truth-incoming

# Moves promoted proposals from truth/incoming/ to their canonical paths after a
# promotion merges into truth. See RUNBOOK.md step 4.

on:
  push:
    branches: [truth]
    paths: ['truth/incoming/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: truth-incoming
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truth

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Move incoming entries to their canonical paths
        run: python .github/scripts/move_incoming.py

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "promote: move truth/incoming/ entries to their canonical paths"
          git push origin HEAD:truth
