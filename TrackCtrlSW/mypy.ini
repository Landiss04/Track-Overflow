[mypy]
python_version = 3.12
mypy_path = stubs
warn_unused_ignores = True
disallow_untyped_defs = True

# PySide6's bundled stubs type Property() only in its non-decorator
# form, so every "@Property(type, notify=signal)" in the QML bridge is
# reported as a bad call. The two codes are silenced for that one
# module rather than project-wide, so the layout, PLC, vital, control
# and system layers stay fully checked.
[mypy-track_ctrl.state]
disable_error_code = call-arg, arg-type
